name: Update Tour Dates

on:
  schedule:
    - cron: "0 15 * * *"  # Daily 3pm UTC
  workflow_dispatch:       # Manual trigger from GitHub Actions UI
    inputs:
      allow_large_drop:
        description: "Accept a list that shrank by more than half (a real mass cancellation)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, and an image swap
    # can break the Playwright install with no change on our side.
    runs-on: ubuntu-24.04
    # Cap a genuinely hung run (e.g. punchup.live stops responding) so it fails
    # fast with one clear error instead of stalling ~15 min before GitHub kills it.
    # (Does not affect a queued/unacquired-runner cancel — that's a GitHub-side wait.)
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright + Chromium
        timeout-minutes: 5
        # No --with-deps: it runs apt against Ubuntu's mirror, which timed this step
        # out on 2026-10-07 and twice on 2026-10-23. The runner image already has
        # Chromium's system libraries; --with-deps only added fonts we don't need.
        # Playwright is pinned (it is not in package.json) so a new Chromium never
        # arrives unannounced: without --with-deps, a version needing a system lib
        # the image lacks would fail every attempt. Bump by hand, test via dispatch.
        run: npm install playwright@1.64.1 && npx playwright install chromium

      - name: Run tour date scraper
        timeout-minutes: 3
        # Exits non-zero WITHOUT writing tour-dates.json if any punchup show fails
        # to parse, "See All" does not expand, or the list comes back empty or under
        # half its size. The commit step is then skipped and the last good list
        # stays live. Guards: scripts/punchup-parse.js.
        env:
          TOUR_ALLOW_LARGE_DROP: ${{ github.event.inputs.allow_large_drop == 'true' && '1' || '' }}
          SCRAPE_FAILURE_FILE: ${{ runner.temp }}/scrape-failure.txt
        run: node scripts/scrape-tour-dates.js

      - name: Commit updated tour dates if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tour-dates.json
          if git diff --staged --quiet; then
            echo "No changes to tour dates — skipping commit."
          else
            git commit -m "chore: update tour dates from punchup.live [skip ci]"
            git push
          fi

      - name: Alert Discord #bot-errors
        # Final attempt only: retry-tour-dates.yml re-runs a failed run up to 3
        # attempts, so an earlier failure may still recover on its own. Needs the
        # repo secret DISCORD_ALERT_WEBHOOK_URL (the #bot-errors webhook); until it
        # exists the script logs a notice and the red run is the only signal.
        if: failure() && github.run_attempt >= 3
        env:
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          FAILURE_FILE: ${{ runner.temp }}/scrape-failure.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-discord-failure.js
